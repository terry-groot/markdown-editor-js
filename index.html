<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled>
<style>
:root {
  --bg: #ffffff;
  --bg-secondary: #f5f5f5;
  --bg-tertiary: #e8e8e8;
  --text: #1a1a1a;
  --text-secondary: #555;
  --border: #ddd;
  --accent: #4a9eff;
  --accent-hover: #3a8eef;
  --toolbar-bg: #fafafa;
  --tab-bg: #e8e8e8;
  --tab-active-bg: #ffffff;
  --tab-hover-bg: #ddd;
  --editor-bg: #ffffff;
  --preview-bg: #ffffff;
  --scrollbar-thumb: #ccc;
  --shadow: rgba(0,0,0,0.08);
}

[data-theme="dark"] {
  --bg: #1e1e1e;
  --bg-secondary: #252526;
  --bg-tertiary: #333;
  --text: #d4d4d4;
  --text-secondary: #999;
  --border: #404040;
  --accent: #4a9eff;
  --accent-hover: #5aafff;
  --toolbar-bg: #2d2d2d;
  --tab-bg: #2d2d2d;
  --tab-active-bg: #1e1e1e;
  --tab-hover-bg: #3a3a3a;
  --editor-bg: #1e1e1e;
  --preview-bg: #1e1e1e;
  --scrollbar-thumb: #555;
  --shadow: rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--border);
  gap: 2px;
  flex-wrap: wrap;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
}

.toolbar-group + .toolbar-group {
  margin-left: 4px;
  padding-left: 6px;
  border-left: 1px solid var(--border);
}

.toolbar button {
  background: none;
  border: 1px solid transparent;
  color: var(--text);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  height: 30px;
  transition: background 0.15s, border-color 0.15s;
}

.toolbar button:hover {
  background: var(--bg-tertiary);
  border-color: var(--border);
}

.toolbar button:active {
  background: var(--border);
}

.toolbar button[title]::after {
  content: none;
}

.toolbar-spacer {
  flex: 1;
}

.toolbar .theme-toggle {
  font-size: 16px;
}

/* Tab bar */
.tab-bar {
  display: flex;
  align-items: stretch;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  min-height: 36px;
}

.tab-bar::-webkit-scrollbar {
  height: 3px;
}

.tab-bar::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 3px;
}

.tab {
  display: flex;
  align-items: center;
  padding: 0 12px;
  height: 36px;
  background: var(--tab-bg);
  border-right: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  gap: 8px;
  transition: background 0.15s;
  user-select: none;
  min-width: 0;
}

.tab:hover {
  background: var(--tab-hover-bg);
}

.tab.active {
  background: var(--tab-active-bg);
  color: var(--text);
  border-bottom: 2px solid var(--accent);
  margin-bottom: -1px;
}

.tab-name {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
}

.tab-name-input {
  background: var(--editor-bg);
  border: 1px solid var(--accent);
  color: var(--text);
  font-size: 13px;
  padding: 1px 4px;
  border-radius: 3px;
  outline: none;
  width: 120px;
}

.tab-close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 3px;
  font-size: 14px;
  line-height: 1;
  opacity: 0.5;
  transition: opacity 0.15s, background 0.15s;
  flex-shrink: 0;
}

.tab-close:hover {
  opacity: 1;
  background: var(--bg-tertiary);
}

.tab-new {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  min-width: 36px;
  height: 36px;
  background: none;
  border: none;
  border-right: none;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 18px;
  transition: background 0.15s, color 0.15s;
}

.tab-new:hover {
  background: var(--tab-hover-bg);
  color: var(--text);
}

/* Main content */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.editor-pane, .preview-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.editor-pane {
  border-right: 1px solid var(--border);
}

.pane-header {
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
}

#editor {
  flex: 1;
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  padding: 16px;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Monaco', monospace;
  font-size: 14px;
  line-height: 1.6;
  background: var(--editor-bg);
  color: var(--text);
  tab-size: 4;
}

#editor::-webkit-scrollbar, #preview::-webkit-scrollbar {
  width: 8px;
}

#editor::-webkit-scrollbar-thumb, #preview::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 4px;
}

#editor::-webkit-scrollbar-track, #preview::-webkit-scrollbar-track {
  background: transparent;
}

#preview {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  background: var(--preview-bg);
}

/* Preview markdown styles */
#preview h1, #preview h2, #preview h3,
#preview h4, #preview h5, #preview h6 {
  margin-top: 24px;
  margin-bottom: 12px;
  font-weight: 600;
  line-height: 1.3;
}

#preview h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
#preview h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
#preview h3 { font-size: 1.25em; }
#preview h4 { font-size: 1em; }

#preview p { margin-bottom: 12px; line-height: 1.7; }

#preview a { color: var(--accent); text-decoration: none; }
#preview a:hover { text-decoration: underline; }

#preview ul, #preview ol { margin-bottom: 12px; padding-left: 24px; }
#preview li { margin-bottom: 4px; line-height: 1.6; }

#preview blockquote {
  margin: 12px 0;
  padding: 8px 16px;
  border-left: 4px solid var(--accent);
  background: var(--bg-secondary);
  color: var(--text-secondary);
}

#preview code {
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  background: var(--bg-secondary);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 0.9em;
}

#preview pre {
  margin: 12px 0;
  border-radius: 6px;
  overflow-x: auto;
}

#preview pre code {
  display: block;
  padding: 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  line-height: 1.5;
}

#preview img {
  max-width: 100%;
  border-radius: 4px;
}

#preview table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
}

#preview th, #preview td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: left;
}

#preview th {
  background: var(--bg-secondary);
  font-weight: 600;
}

#preview hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}

#preview input[type="checkbox"] {
  margin-right: 6px;
}

/* Status bar */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
}

.status-left, .status-right {
  display: flex;
  gap: 16px;
}

/* Splitter */
.splitter {
  width: 4px;
  cursor: col-resize;
  background: var(--border);
  transition: background 0.15s;
  flex-shrink: 0;
}

.splitter:hover, .splitter.dragging {
  background: var(--accent);
}

/* Responsive */
@media (max-width: 768px) {
  .main {
    flex-direction: column;
  }
  .editor-pane {
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .splitter {
    width: auto;
    height: 4px;
    cursor: row-resize;
  }
  .toolbar {
    padding: 4px 8px;
  }
  .toolbar button {
    padding: 4px 6px;
    min-width: 26px;
    height: 26px;
    font-size: 12px;
  }
}
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-group">
    <button onclick="insertFormat('bold')" title="Bold (Ctrl+B)"><b>B</b></button>
    <button onclick="insertFormat('italic')" title="Italic (Ctrl+I)"><i>I</i></button>
    <button onclick="insertFormat('strikethrough')" title="Strikethrough"><s>S</s></button>
  </div>
  <div class="toolbar-group">
    <button onclick="insertFormat('h1')" title="Heading 1">H1</button>
    <button onclick="insertFormat('h2')" title="Heading 2">H2</button>
    <button onclick="insertFormat('h3')" title="Heading 3">H3</button>
  </div>
  <div class="toolbar-group">
    <button onclick="insertFormat('ul')" title="Unordered List">&#8226; List</button>
    <button onclick="insertFormat('ol')" title="Ordered List">1. List</button>
    <button onclick="insertFormat('checklist')" title="Checklist">&#9745;</button>
  </div>
  <div class="toolbar-group">
    <button onclick="insertFormat('link')" title="Link (Ctrl+K)">&#128279;</button>
    <button onclick="insertFormat('image')" title="Image">&#128247;</button>
    <button onclick="insertFormat('code')" title="Inline Code">&#60;/&#62;</button>
    <button onclick="insertFormat('codeblock')" title="Code Block">{ }</button>
  </div>
  <div class="toolbar-group">
    <button onclick="insertFormat('quote')" title="Quote">&#8220; &#8221;</button>
    <button onclick="insertFormat('hr')" title="Horizontal Rule">&#8213;</button>
    <button onclick="insertFormat('table')" title="Table">&#9638;</button>
  </div>
  <div class="toolbar-spacer"></div>
  <div class="toolbar-group">
    <button onclick="openFile()" title="Open file (Ctrl+O)">&#128194; Open</button>
    <button onclick="saveFile()" title="Save (Ctrl+S)">&#128190; Save</button>
    <button onclick="saveFileAs()" title="Save As (Ctrl+Shift+S)">&#128190; Save As</button>
    <button onclick="reloadFile()" title="Reload from disk (F5)">&#8635; Reload</button>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme" id="theme-btn">&#9789;</button>
  </div>
</div>

<!-- Tab bar -->
<div class="tab-bar" id="tab-bar">
  <button class="tab-new" onclick="createTab()" title="New file (Ctrl+N)">+</button>
</div>

<!-- Main content -->
<div class="main">
  <div class="editor-pane">
    <div class="pane-header">Editor</div>
    <textarea id="editor" spellcheck="false" placeholder="Start writing Markdown..."></textarea>
  </div>
  <div class="splitter" id="splitter"></div>
  <div class="preview-pane">
    <div class="pane-header">Preview</div>
    <div id="preview"></div>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <div class="status-left">
    <span id="status-file">Untitled-1.md</span>
  </div>
  <div class="status-right">
    <span id="status-words">0 words</span>
    <span id="status-chars">0 chars</span>
  </div>
</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const tabBar = document.getElementById('tab-bar');
const statusFile = document.getElementById('status-file');
const statusWords = document.getElementById('status-words');
const statusChars = document.getElementById('status-chars');
const themeBtn = document.getElementById('theme-btn');

marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  }
});

let tabs = [];
let activeTabId = null;
let tabCounter = 0;

function generateId() {
  return 'tab_' + Date.now() + '_' + (++tabCounter);
}

// IndexedDB for persisting file handles across sessions
function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('md-editor-handles', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveHandle(tabId, handle) {
  try {
    const db = await openHandleDB();
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, tabId);
    await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
  } catch (e) {}
}

async function loadHandle(tabId) {
  try {
    const db = await openHandleDB();
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get(tabId);
    return new Promise((res) => { req.onsuccess = () => res(req.result || null); req.onerror = () => res(null); });
  } catch (e) { return null; }
}

async function removeHandle(tabId) {
  try {
    const db = await openHandleDB();
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').delete(tabId);
  } catch (e) {}
}

async function saveLastDir(handle) {
  try {
    const db = await openHandleDB();
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, '__last_dir__');
  } catch (e) {}
}

async function getLastDir() {
  return loadHandle('__last_dir__');
}

async function loadState() {
  createTab();
}

function saveState() {
  try {
    const serializableTabs = tabs.map(t => ({
      id: t.id, name: t.name, content: t.content,
      scrollTop: t.scrollTop, selectionStart: t.selectionStart, selectionEnd: t.selectionEnd
    }));
    const state = { tabs: serializableTabs, activeTabId, tabCounter };
    localStorage.setItem('md-editor-state', JSON.stringify(state));
  } catch (e) {}
}

function createTab(name) {
  const id = generateId();
  const existingNames = tabs.map(t => t.name);
  if (!name) {
    let n = 1;
    while (existingNames.includes('Untitled-' + n + '.md')) n++;
    name = 'Untitled-' + n + '.md';
  }
  tabs.push({ id, name, content: '', scrollTop: 0, selectionStart: 0, selectionEnd: 0, fileHandle: null });
  renderTabs();
  switchTab(id);
  saveState();
}

function closeTab(id, e) {
  if (e) e.stopPropagation();
  removeHandle(id);
  const idx = tabs.findIndex(t => t.id === id);
  tabs.splice(idx, 1);
  if (tabs.length === 0) {
    createTab();
  } else if (activeTabId === id) {
    const newIdx = Math.min(idx, tabs.length - 1);
    switchTab(tabs[newIdx].id);
  } else {
    renderTabs();
  }
  saveState();
}

function switchTab(id) {
  const currentTab = tabs.find(t => t.id === activeTabId);
  if (currentTab) {
    currentTab.content = editor.value;
    currentTab.scrollTop = editor.scrollTop;
    currentTab.selectionStart = editor.selectionStart;
    currentTab.selectionEnd = editor.selectionEnd;
  }

  activeTabId = id;
  const tab = tabs.find(t => t.id === id);
  if (!tab) return;

  editor.value = tab.content;
  editor.scrollTop = tab.scrollTop;
  editor.selectionStart = tab.selectionStart;
  editor.selectionEnd = tab.selectionEnd;
  editor.focus();

  statusFile.textContent = tab.name + (tab.fileHandle ? '' : ' (unsaved)');
  updatePreview();
  updateStatus();
  renderTabs();
  saveState();
}

function loadIntoTab(tab) {
  activeTabId = tab.id;
  editor.value = tab.content;
  editor.scrollTop = 0;
  editor.selectionStart = editor.selectionEnd = 0;
  editor.focus();
  statusFile.textContent = tab.name + (tab.fileHandle ? '' : ' (unsaved)');
  updatePreview();
  updateStatus();
  renderTabs();
  saveState();
}

function startRename(id, e) {
  e.stopPropagation();
}

function renderTabs() {
  const newBtn = tabBar.querySelector('.tab-new');
  tabBar.querySelectorAll('.tab').forEach(el => el.remove());

  tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
    el.setAttribute('data-id', tab.id);
    el.onclick = () => switchTab(tab.id);
    el.ondblclick = (e) => startRename(tab.id, e);

    const nameSpan = document.createElement('span');
    nameSpan.className = 'tab-name';
    nameSpan.textContent = tab.name;
    el.appendChild(nameSpan);

    const closeBtn = document.createElement('span');
    closeBtn.className = 'tab-close';
    closeBtn.textContent = '×';
    closeBtn.onclick = (e) => closeTab(tab.id, e);
    el.appendChild(closeBtn);

    tabBar.insertBefore(el, newBtn);
  });
}

function updatePreview() {
  preview.innerHTML = marked.parse(editor.value);
  preview.querySelectorAll('pre code').forEach(block => {
    hljs.highlightElement(block);
  });
}

function updateStatus() {
  const text = editor.value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  statusWords.textContent = words + ' word' + (words !== 1 ? 's' : '');
  statusChars.textContent = text.length + ' char' + (text.length !== 1 ? 's' : '');
}

let previewTimer;
editor.addEventListener('input', () => {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    updatePreview();
    updateStatus();
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab) tab.content = editor.value;
    saveState();
  }, 150);
});

// Formatting
function insertFormat(type) {
  editor.focus();
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const text = editor.value;
  const selected = text.substring(start, end);
  let before = '', after = '', replacement = '';

  const lineStart = text.lastIndexOf('\n', start - 1) + 1;
  const isLineStart = start === lineStart;

  switch (type) {
    case 'bold':
      before = '**'; after = '**';
      replacement = before + (selected || 'bold text') + after;
      break;
    case 'italic':
      before = '*'; after = '*';
      replacement = before + (selected || 'italic text') + after;
      break;
    case 'strikethrough':
      before = '~~'; after = '~~';
      replacement = before + (selected || 'text') + after;
      break;
    case 'h1':
      replacement = (isLineStart ? '' : '\n') + '# ' + (selected || 'Heading 1');
      break;
    case 'h2':
      replacement = (isLineStart ? '' : '\n') + '## ' + (selected || 'Heading 2');
      break;
    case 'h3':
      replacement = (isLineStart ? '' : '\n') + '### ' + (selected || 'Heading 3');
      break;
    case 'ul':
      replacement = (isLineStart ? '' : '\n') + '- ' + (selected || 'List item');
      break;
    case 'ol':
      replacement = (isLineStart ? '' : '\n') + '1. ' + (selected || 'List item');
      break;
    case 'checklist':
      replacement = (isLineStart ? '' : '\n') + '- [ ] ' + (selected || 'Task');
      break;
    case 'link':
      replacement = '[' + (selected || 'link text') + '](url)';
      break;
    case 'image':
      replacement = '![' + (selected || 'alt text') + '](image-url)';
      break;
    case 'code':
      before = '`'; after = '`';
      replacement = before + (selected || 'code') + after;
      break;
    case 'codeblock':
      replacement = (isLineStart ? '' : '\n') + '```\n' + (selected || 'code') + '\n```';
      break;
    case 'quote':
      replacement = (isLineStart ? '' : '\n') + '> ' + (selected || 'quote');
      break;
    case 'hr':
      replacement = (isLineStart ? '' : '\n') + '---\n';
      break;
    case 'table':
      replacement = (isLineStart ? '' : '\n') + '| Header 1 | Header 2 | Header 3 |\n| -------- | -------- | -------- |\n| Cell 1   | Cell 2   | Cell 3   |\n';
      break;
  }

  editor.value = text.substring(0, start) + replacement + text.substring(end);

  if (before && after) {
    if (selected) {
      editor.selectionStart = start;
      editor.selectionEnd = start + replacement.length;
    } else {
      editor.selectionStart = start + before.length;
      editor.selectionEnd = start + replacement.length - after.length;
    }
  } else {
    editor.selectionStart = editor.selectionEnd = start + replacement.length;
  }

  editor.dispatchEvent(new Event('input'));
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'F5') {
    e.preventDefault();
    reloadFile();
    return;
  }

  const isMod = e.ctrlKey || e.metaKey;
  if (!isMod) return;

  switch (e.key.toLowerCase()) {
    case 'b':
      e.preventDefault();
      insertFormat('bold');
      break;
    case 'i':
      e.preventDefault();
      insertFormat('italic');
      break;
    case 'k':
      e.preventDefault();
      insertFormat('link');
      break;
    case 'n':
      e.preventDefault();
      createTab();
      break;
    case 'w':
      e.preventDefault();
      closeTab(activeTabId);
      break;
    case 'o':
      e.preventDefault();
      openFile();
      break;
    case 's':
      e.preventDefault();
      if (e.shiftKey) {
        saveFileAs();
      } else {
        saveFile();
      }
      break;
  }
});

// Tab key for indentation
editor.addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 4;
    this.dispatchEvent(new Event('input'));
  }
});

// Theme
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  themeBtn.textContent = newTheme === 'dark' ? '☀' : '☽';

  document.getElementById('hljs-light').disabled = newTheme === 'dark';
  document.getElementById('hljs-dark').disabled = newTheme !== 'dark';

  try { localStorage.setItem('md-editor-theme', newTheme); } catch (e) {}
}

function loadTheme() {
  try {
    const saved = localStorage.getItem('md-editor-theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀';
      document.getElementById('hljs-light').disabled = true;
      document.getElementById('hljs-dark').disabled = false;
    }
  } catch (e) {}
}

// File operations using File System Access API
const filePickerTypes = [
  { description: 'Markdown Files', accept: { 'text/markdown': ['.md', '.markdown'] } },
  { description: 'Text Files', accept: { 'text/plain': ['.txt'] } },
  { description: 'All Files', accept: { '*/*': [] } }
];

async function openFile() {
  if (!window.showOpenFilePicker) {
    openFileFallback();
    return;
  }
  try {
    const lastDir = await getLastDir();
    const opts = { multiple: false, types: filePickerTypes };
    if (lastDir) opts.startIn = lastDir;
    const [handle] = await window.showOpenFilePicker(opts);
    await saveLastDir(handle);
    const file = await handle.getFile();
    const content = await file.text();
    const existing = tabs.find(t => t.fileHandle && t.fileHandle.name === handle.name);
    if (existing) {
      existing.content = content;
      existing.fileHandle = handle;
      await saveHandle(existing.id, handle);
      loadIntoTab(existing);
    } else {
      const empty = tabs.find(t => !t.fileHandle && !t.content && t.name.startsWith('Untitled-'));
      if (empty) {
        empty.name = file.name;
        empty.content = content;
        empty.fileHandle = handle;
        await saveHandle(empty.id, handle);
        loadIntoTab(empty);
      } else {
        const id = generateId();
        const newTab = { id, name: file.name, content, scrollTop: 0, selectionStart: 0, selectionEnd: 0, fileHandle: handle };
        tabs.push(newTab);
        await saveHandle(id, handle);
        loadIntoTab(newTab);
      }
    }
    saveState();
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

function openFileFallback() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.md,.markdown,.txt';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const content = await file.text();
    const empty = tabs.find(t => !t.fileHandle && !t.content && t.name.startsWith('Untitled-'));
    if (empty) {
      empty.name = file.name;
      empty.content = content;
      loadIntoTab(empty);
    } else {
      const id = generateId();
      const newTab = { id, name: file.name, content, scrollTop: 0, selectionStart: 0, selectionEnd: 0, fileHandle: null };
      tabs.push(newTab);
      loadIntoTab(newTab);
    }
    saveState();
  };
  input.click();
}

async function saveFile() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;
  tab.content = editor.value;
  if (tab.fileHandle) {
    try {
      const perm = await tab.fileHandle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') { await saveFileAs(); return; }
      const writable = await tab.fileHandle.createWritable();
      await writable.write(editor.value);
      await writable.close();
      statusFile.textContent = tab.name;
      showSaveIndicator();
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  await saveFileAs();
}

async function saveFileAs() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;
  tab.content = editor.value;
  if (!window.showSaveFilePicker) {
    downloadFileFallback();
    return;
  }
  try {
    const lastDir = await getLastDir();
    const opts = { suggestedName: tab.name, types: filePickerTypes };
    if (lastDir) opts.startIn = lastDir;
    const handle = await window.showSaveFilePicker(opts);
    await saveLastDir(handle);
    const writable = await handle.createWritable();
    await writable.write(editor.value);
    await writable.close();
    tab.fileHandle = handle;
    tab.name = handle.name;
    await saveHandle(tab.id, handle);
    statusFile.textContent = tab.name;
    renderTabs();
    saveState();
    showSaveIndicator();
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

function downloadFileFallback() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;
  const blob = new Blob([editor.value], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = tab.name;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function reloadFile() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;
  if (tab.fileHandle) {
    try {
      const perm = await tab.fileHandle.requestPermission({ mode: 'read' });
      if (perm !== 'granted') return;
      const file = await tab.fileHandle.getFile();
      const content = await file.text();
      tab.content = content;
      editor.value = content;
      updatePreview();
      updateStatus();
      saveState();
      showSaveIndicator('Reloaded');
    } catch (e) {
      console.error(e);
    }
  }
}

function showSaveIndicator(text) {
  const msg = text || 'Saved';
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;top:12px;right:12px;background:var(--accent);color:#fff;padding:6px 16px;border-radius:6px;font-size:13px;z-index:9999;opacity:1;transition:opacity 0.4s;';
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; }, 1200);
  setTimeout(() => { el.remove(); }, 1600);
}

// Splitter drag
const splitter = document.getElementById('splitter');
let isDragging = false;

splitter.addEventListener('mousedown', function(e) {
  isDragging = true;
  splitter.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});

document.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  const container = document.querySelector('.main');
  const rect = container.getBoundingClientRect();
  const editorPane = document.querySelector('.editor-pane');
  const previewPane = document.querySelector('.preview-pane');
  const ratio = (e.clientX - rect.left) / rect.width;
  const clamped = Math.max(0.2, Math.min(0.8, ratio));
  editorPane.style.flex = 'none';
  editorPane.style.width = (clamped * 100) + '%';
  previewPane.style.flex = '1';
});

document.addEventListener('mouseup', function() {
  if (isDragging) {
    isDragging = false;
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});

// Init
loadTheme();
loadState();
</script>
